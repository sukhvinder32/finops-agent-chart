# FinOps Agent Helm Values for GKE with Cloudability
# Configuration for standalone finops-agent deployment

## Global Configuration
global:
  # Cluster identification
  clusterId: "finops-test-config"  # CHANGE: Your GKE cluster name
  clusterName: "finops-test-config"  # CHANGE: Your GKE cluster name
  
  # Cloud provider
  cloudProvider: "gcp"
  
  # GCP Project
  gcpProjectId: "ci-cd-370014"  # CHANGE: Your GCP project ID

## FinOps Agent Configuration
finopsAgent:
  enabled: true
  
  # Image configuration
  image:
    repository: icr.io/ibm-finops/agent
    tag: v1.0.8
    pullPolicy: IfNotPresent
  
  # Image pull secrets (if using private IBM Cloud Registry)
  imagePullSecrets: []
  # - name: icr-secret
  
  # Replica configuration
  replicaCount: 1
  
  # Agent mode
  mode: "standalone"
  
  # Data collection interval (in seconds)
  collectionInterval: 3600  # 1 hour
  
  # Log level: debug, info, warn, error
  logLevel: "info"
  
  # Resources
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Node selector
  nodeSelector: {}
  
  # Tolerations
  tolerations: []
  
  # Affinity
  affinity: {}
  
  # Pod annotations
  podAnnotations: {}
  
  # Pod labels
  podLabels:
    app: finops-agent
    version: v1.0.8
  
  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  
  # Container security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false
  
  # Service account
  serviceAccount:
    create: true
    name: finops-agent
    annotations:
      iam.gke.io/gcp-service-account: "finops-agent-sa@ci-cd-370014.iam.gserviceaccount.com"  # CHANGE: Your SA email
  
  # Health probes - DISABLED by default as agent may not expose these endpoints
  livenessProbe:
    enabled: false
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  
  readinessProbe:
    enabled: false
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  
  # Service configuration
  service:
    enabled: true
    type: ClusterIP
    port: 8080
    targetPort: 8080
  
  # Environment variables
  env:
    - name: CLUSTER_NAME
      value: "finops-test-config"  # CHANGE: Your cluster name
    - name: GCP_PROJECT_ID
      value: "ci-cd-370014"  # CHANGE: Your GCP project ID
    - name: COLLECTION_INTERVAL
      value: "3600"
    - name: LOG_LEVEL
      value: "info"
    - name: AGENT_MODE
      value: "standalone"
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: "/var/secrets/gcp/key.json"
    # GCP_KEY environment variable will be set from secret
    - name: GCP_KEY
      valueFrom:
        secretKeyRef:
          name: finops-agent-secrets
          key: gcp-service-account-key
  
  # Volume mounts
  volumeMounts:
    - name: gcp-credentials
      mountPath: /var/secrets/gcp
      readOnly: true
  
  # Volumes
  volumes:
    - name: gcp-credentials
      secret:
        secretName: finops-agent-secrets
        items:
          - key: gcp-service-account-key
            path: key.json

## GCP Configuration
gcp:
  # GCP service account key secret
  # This should be created beforehand using:
  # kubectl create secret generic finops-agent-secrets \
  #   --from-file=gcp-service-account-key=finops-agent-key.json \
  #   -n finops-agent
  serviceAccountSecret:
    name: finops-agent-secrets
    key: gcp-service-account-key
  
  # GCP Project ID
  projectId: "ci-cd-370014"  # CHANGE: Your GCP project ID
  
  # GCP Region
  region: "us-central1"  # CHANGE: Your region
  
  # Workload Identity (if using)
  workloadIdentity:
    enabled: true
    serviceAccount: "finops-agent-sa@ci-cd-370014.iam.gserviceaccount.com"  # CHANGE: Your SA

## Cloudability Configuration
cloudability:
  enabled: true
  
  # Cloudability API endpoint
  apiEndpoint: "https://api.cloudability.com"
  
  # Cloudability API key (stored in secret)
  # Create secret using:
  # kubectl create secret generic cloudability-secret \
  #   --from-literal=api-key=YOUR_CLOUDABILITY_API_KEY \
  #   -n finops-agent
  apiKeySecret:
    name: cloudability-secret
    key: api-key
  
  # Cloudability Organization ID
  organizationId: ""  # CHANGE: Your Cloudability org ID (if required)
  
  # Data export configuration
  export:
    enabled: true
    interval: 3600  # Export every hour
    format: "cloudability"  # Export format for Cloudability
  
  # Environment variables for Cloudability
  env:
    - name: CLOUDABILITY_API_ENDPOINT
      value: "https://api.cloudability.com"
    - name: CLOUDABILITY_API_KEY
      valueFrom:
        secretKeyRef:
          name: cloudability-secret
          key: api-key

## RBAC Configuration
rbac:
  create: true
  
  # ClusterRole rules
  rules:
    # Core resources
    - apiGroups: [""]
      resources:
        - namespaces
        - nodes
        - pods
        - persistentvolumes
        - persistentvolumeclaims
        - services
        - resourcequotas
        - replicationcontrollers
        - limitranges
        - configmaps
      verbs: ["get", "list", "watch"]
    
    # Apps resources
    - apiGroups: ["apps"]
      resources:
        - deployments
        - statefulsets
        - daemonsets
        - replicasets
      verbs: ["get", "list", "watch"]
    
    # Batch resources
    - apiGroups: ["batch"]
      resources:
        - jobs
        - cronjobs
      verbs: ["get", "list", "watch"]
    
    # Storage resources
    - apiGroups: ["storage.k8s.io"]
      resources:
        - storageclasses
      verbs: ["get", "list", "watch"]
    
    # Policy resources
    - apiGroups: ["policy"]
      resources:
        - poddisruptionbudgets
      verbs: ["get", "list", "watch"]
    
    # Autoscaling resources
    - apiGroups: ["autoscaling"]
      resources:
        - horizontalpodautoscalers
      verbs: ["get", "list", "watch"]
    
    # Networking resources
    - apiGroups: ["networking.k8s.io"]
      resources:
        - ingresses
      verbs: ["get", "list", "watch"]

## Namespace Configuration
namespace:
  create: true
  name: finops-agent

## ConfigMap Configuration
configMap:
  create: true
  name: finops-agent-config
  data:
    CLUSTER_NAME: "finops-test-config"  # CHANGE: Your cluster name
    GCP_PROJECT_ID: "ci-cd-370014"  # CHANGE: Your GCP project ID
    COLLECTION_INTERVAL: "3600"
    LOG_LEVEL: "info"
    AGENT_MODE: "standalone"

## Monitoring Configuration (Optional)
monitoring:
  enabled: false
  
  serviceMonitor:
    enabled: false
    interval: 30s
    path: /metrics
    
  prometheusRule:
    enabled: false

## Network Policy (Optional)
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  
  egress:
    # Allow DNS
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 53
      - protocol: UDP
        port: 53
    
    # Allow HTTPS to GCP APIs
    - to:
      - podSelector: {}
      ports:
      - protocol: TCP
        port: 443
    
    # Allow HTTPS to Cloudability
    - to:
      - podSelector: {}
      ports:
      - protocol: TCP
        port: 443

## Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

## Priority Class
priorityClassName: ""

## DNS Configuration
dnsPolicy: ClusterFirst
dnsConfig: {}

## Host Aliases
hostAliases: []

## Init Containers (if needed)
initContainers: []

## Sidecar Containers (if needed)
sidecars: []

## Extra Volumes
extraVolumes: []

## Extra Volume Mounts
extraVolumeMounts: []

## Extra Environment Variables
extraEnv: []

## Extra Environment Variables from ConfigMap/Secret
extraEnvFrom: []