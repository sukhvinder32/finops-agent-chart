---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: finops-agent-cluster-role
rules:
# Core resources
- apiGroups: [""]
  resources: 
    - "namespaces"
    - "nodes"
    - "pods"
    - "persistentvolumes"
    - "persistentvolumeclaims"
    - "services"
    - "resourcequotas"
    - "replicationcontrollers"
    - "limitranges"
    - "configmaps"
  verbs: ["get", "list", "watch"]
# Apps resources
- apiGroups: ["apps"]
  resources: 
    - "deployments"
    - "statefulsets"
    - "daemonsets"
    - "replicasets"
  verbs: ["get", "list", "watch"]
# Batch resources
- apiGroups: ["batch"]
  resources: 
    - "jobs"
    - "cronjobs"
  verbs: ["get", "list", "watch"]
# Storage resources
- apiGroups: ["storage.k8s.io"]
  resources: 
    - "storageclasses"
  verbs: ["get", "list", "watch"]
# Policy resources
- apiGroups: ["policy"]
  resources: 
    - "poddisruptionbudgets"
  verbs: ["get", "list", "watch"]
# Autoscaling resources
- apiGroups: ["autoscaling"]
  resources: 
    - "horizontalpodautoscalers"
  verbs: ["get", "list", "watch"]
# Networking resources
- apiGroups: ["networking.k8s.io"]
  resources: 
    - "ingresses"
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: finops-agent-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: finops-agent-cluster-role
subjects:
- kind: ServiceAccount
  name: finops-agent
  namespace: finops-agent