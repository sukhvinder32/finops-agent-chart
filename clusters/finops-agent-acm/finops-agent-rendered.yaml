# Source: finops-agent/templates/extra-manifests.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kubecost-local-store
  name: kubecost-local-store
  namespace: finops-agent-acm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubecost-local-store
  template:
    metadata:
      labels:
        app: kubecost-local-store
    spec:
      containers:
      - args:
        - cluster-storage
        env:
        - name: CONFIG_PATH
          value: /var/configs/
        - name: RESOLUTION_10M_RETENTION
          value: "1"
        - name: RESOLUTION_1H_RETENTION
          value: "1"
        - name: RESOLUTION_1D_RETENTION
          value: "1"
        image: gcr.io/kubecost1/cost-model-nightly:latest
        name: local-object-store
        ports:
        - containerPort: 9006
          name: tcp-api
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9006
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - mountPath: /var/configs
          name: file-storage
      volumes:
      - emptyDir: {}
        name: file-storage
